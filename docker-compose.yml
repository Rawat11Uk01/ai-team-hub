services:
  postgres:
    image: postgres:16
    container_name: ai_team_hub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kashish
      POSTGRES_PASSWORD: root_user
      POSTGRES_DB: ai_team_hub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kashish -d ai_team_hub"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai_team_hub_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
